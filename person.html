<script>
// Clickjacking defence-in-depth: GitHub Pages can't send custom HTTP
// headers (no X-Frame-Options / CSP frame-ancestors is possible), so this
// page busts out of any frame it's loaded into via JavaScript instead. Not
// bulletproof against a determined attacker (a sandboxed iframe without
// allow-top-navigation can suppress the redirect) but stops the common
// case, and the page stays hidden while framed either way. See the
// security review for the recommended real fix (a proxy such as
// Cloudflare in front of the domain, which CAN set these headers).
(function () {
  if (window.top !== window.self) {
    try { window.top.location.href = window.self.location.href; } catch (e) {}
    document.documentElement.style.display = 'none';
  }
})();
</script>
